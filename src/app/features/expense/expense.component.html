<div class="space-y-6">


    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Financial Overview</h1>
            <p class="text-xs text-slate-500 mt-0.5">Real-time financial insights to help you make informed
                decisions</p>
        </div>
    </div>


    <div class="flex items-center gap-2 border-b border-slate-200/80 pb-2">
        <button (click)="setActiveTab('dashboard')" [class]="activeTab === 'dashboard'
? 'bg-slate-900 text-white font-medium text-xs px-4 py-2 rounded-xl transition-all shadow-sm'
: 'text-slate-600 hover:text-slate-900 hover:bg-slate-100 font-medium text-xs px-4 py-2 rounded-xl
transition-all'">
            Dashboard
        </button>

        <button (click)="setActiveTab('transactions')" [class]="activeTab === 'transactions'
? 'bg-slate-900 text-white font-medium text-xs px-4 py-2 rounded-xl transition-all shadow-sm'
: 'text-slate-600 hover:text-slate-900 hover:bg-slate-100 font-medium text-xs px-4 py-2 rounded-xl
transition-all'">
            Transactions
        </button>

        <button (click)="setActiveTab('analytics')" [class]="activeTab === 'analytics'
? 'bg-slate-900 text-white font-medium text-xs px-4 py-2 rounded-xl transition-all shadow-sm'
: 'text-slate-600 hover:text-slate-900 hover:bg-slate-100 font-medium text-xs px-4 py-2 rounded-xl
transition-all'">
            Analytics
        </button>
    </div>


    @switch (activeTab) {
    @case ('dashboard') {
    <app-expense-dashboard></app-expense-dashboard>
    }
    @case ('transactions') {
    <app-expense-transactions></app-expense-transactions>
    }
    @case ('analytics') {
    <app-expense-analytics></app-expense-analytics>
    }
    }

</div>
