<mat-card class="!bg-slate-900 !text-white !rounded-2xl !p-5 !shadow-sm">
    <div class="flex items-center justify-between">

        <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                Filtered Total
            </p>
            <h3 class="text-2xl font-bold text-emerald-400 mt-1">
                {{ totalAmount | currency:'USD':'symbol':'1.2-2' }}
            </h3>
        </div>

        <div class="text-right">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                Filtered Count
            </p>
            <span class="inline-block mt-1 bg-slate-800 text-slate-200 text-xs font-bold px-3 py-1 rounded-full">
                {{ totalCount }} {{ totalCount === 1 ? 'record' : 'records' }}
            </span>
        </div>

    </div>
</mat-card>
